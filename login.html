<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-container">

    <div class="login-logo">
        ⚕
    </div>

    <h1>تسجيل الدخول</h1>

    <p>نظام قسم هندسة الطب الحياتي</p>

    <form id="loginForm">

        <label>اسم المستخدم</label>
        <input
            type="text"
            id="username"
            placeholder="أدخل اسم المستخدم"
            required
        >

        <label>كلمة المرور</label>
        <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
            required
        >

        <button type="submit" class="btn primary full">
            تسجيل الدخول
        </button>

    </form>

    <div id="loginMessage"></div>

    <div class="demo-login">
        <strong>بيانات الدخول التجريبية</strong>
        <p>Username: <b>admin</b></p>
        <p>Password: <b>1234</b></p>
    </div>

    <a href="index.html" class="back-home">
        ← العودة إلى الرئيسية
    </a>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("loginMessage");

    if (username === "admin" && password === "1234") {

        localStorage.setItem("adminLoggedIn", "true");

        message.innerHTML =
            '<div class="success">تم تسجيل الدخول بنجاح...</div>';

        setTimeout(function() {
            window.location.href = "admin.html";
        }, 700);

    } else {

        message.innerHTML =
            '<div class="error">اسم المستخدم أو كلمة المرور غير صحيحة.</div>';

    }

});

</script>

</body>
</html>
