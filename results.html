<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>نتائج الطلبة</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">

        <div class="logo-icon">
            ⚕
        </div>

        <div>

            <h2>
                هندسة الطب الحياتي
            </h2>

            <span>
                Biomedical Engineering
            </span>

        </div>

    </div>

    <nav>

        <a href="index.html">
            الرئيسية
        </a>

        <a href="lectures.html">
            المحاضرات
        </a>

        <a href="schedule.html">
            الجدول
        </a>

        <a href="results.html" class="active">
            النتائج
        </a>

        <a href="login.html" class="login-btn">
            الإدارة
        </a>

    </nav>

</header>

<main class="page-container">

    <div class="page-title">

        <span>STUDENT RESULTS</span>

        <h1>
            نتائج الطلبة
        </h1>

        <p>
            أدخل الرقم الجامعي للاستعلام عن النتيجة.
        </p>

    </div>

    <div class="result-search">

        <input
            type="text"
            id="studentId"
            placeholder="مثال: 2026001">

        <button
            onclick="searchResult()"
            class="btn primary">

            بحث عن النتيجة

        </button>

    </div>

    <div id="resultBox"></div>

</main>

<footer>

    <h3>
        قسم هندسة الطب الحياتي
    </h3>

    <p>
        Biomedical Engineering Department
    </p>

    <p>
        © 2026
    </p>

</footer>

<script>

const students = {

    "2026001": {

        name: "أحمد محمد علي",

        stage: "المرحلة الثالثة",

        average: "82.5",

        status: "ناجح"

    },

    "2026002": {

        name: "محمد علي حسن",

        stage: "المرحلة الثالثة",

        average: "76.8",

        status: "ناجح"

    },

    "2026003": {

        name: "حسين علي",

        stage: "المرحلة الرابعة",

        average: "88.2",

        status: "ناجح"

    }

};

function searchResult() {

    const id =
        document.getElementById("studentId").value.trim();

    const box =
        document.getElementById("resultBox");

    if (students[id]) {

        const student = students[id];

        box.innerHTML = `

            <div class="result-card">

                <div class="result-icon">
                    🎓
                </div>

                <h2>
                    ${student.name}
                </h2>

                <p>
                    الرقم الجامعي: ${id}
                </p>

                <p>
                    ${student.stage}
                </p>

                <div class="average">
                    ${student.average}%
                </div>

                <div class="result-success">
                    ${student.status}
                </div>

            </div>

        `;

    } else {

        box.innerHTML = `

            <div class="error result-error">

                لم يتم العثور على طالب بهذا الرقم.

            </div>

        `;

    }

}

</script>

</body>
</html>
